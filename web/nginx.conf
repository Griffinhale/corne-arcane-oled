# The browser shell, served as static files.
#
# Behind Dokku's TLS-terminating proxy, so this nginx sees plain http on :80.
# Keep redirects scheme-relative so an https request is never downgraded.
#
# Two nginx inheritance rules shape the whole of this file, and both bite
# silently rather than erroring:
#
#   1. A `types` block does not add to the inherited MIME map, it REPLACES it.
#      One added here to be explicit about .wasm cost every other file its
#      type, and index.html was served as application/octet-stream -- which a
#      browser downloads instead of rendering. The base mime.types has mapped
#      application/wasm since nginx 1.21.4, so the right move is to inherit it
#      and check with curl rather than to restate it.
#
#   2. `add_header` is inherited into a location only if that location declares
#      no add_header of its own. One Cache-Control inside `location /` was
#      enough to drop the CSP and every hardening header from every response
#      the site actually serves. So all of them live together at server level
#      and the location holds nothing but try_files.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/wasm
        image/svg+xml;

    # No asset here carries a content hash in its name, so nothing may be
    # cached immutably: a redeploy that changed duel_city.wasm while a browser
    # held an old copy would run a different world from the one the URL names,
    # which is the one failure this project cannot have. Revalidation on every
    # request, answered with a 304 from the ETag, keeps it honest for the price
    # of a conditional request on a page this small.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # The page is entirely self-contained: no CDN, no font host, no analytics,
    # no third-party anything. So the policy that describes it is nearly empty,
    # and putting it in a header makes the claim enforceable by the browser
    # rather than merely true today.
    #
    # 'wasm-unsafe-eval' is the one addition that looks alarming and is not: it
    # is the narrow permission to compile WebAssembly, which Chrome requires
    # before it will instantiate the module at all. It does not permit eval().
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
